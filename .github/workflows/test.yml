name: Test

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["*"]

permissions:
    contents: read

jobs:
    test:
        timeout-minutes: 2
        runs-on: ubuntu-latest

        steps:
            - name: setup repo
              uses: actions/checkout@v4

            - name: setup deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: 2.9.8

            - name: check
              run: make check

            - name: run tests
              run: make test
